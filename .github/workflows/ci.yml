# ==============================================================================
# WSU Workshop: TypeScript & CI/CD Demo - GitHub Actions CI Quality Gate
# ==============================================================================
#
# CONCEPT: Continuous Integration (CI) Quality Gates
# ------------------------------------------------------------------------------
# Continuous Integration is the practice of automatically building and testing
# code changes whenever commits are pushed or pull requests are opened.
#
# If any step in this job fails (returns a non-zero exit code), GitHub marks the
# build as failed and blocks merging, preventing broken code from entering `main`.
# ==============================================================================

name: CI Quality Gate

# Trigger events: When should this pipeline execute?
on:
  push:
    branches: [main] # Runs on every direct commit/merge to main
  pull_request:
    branches: [main] # Runs on every pull request targeting main

jobs:
  validate:
    name: Run Quality Gates & Tests
    # Target operating system for the runner VM (clean Ubuntu Linux instance)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository onto the runner runner environment
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Node.js runtime and configure package caching for fast runs
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Step 3: Clean install dependencies from package-lock.json (deterministic & fast)
      # Unlike 'npm install', 'npm ci' requires package-lock.json and guarantees exact versions
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run the TypeScript compiler in typecheck mode (no emit) to verify types
      - name: Type Check
        run: npm run typecheck

      # Step 5: Run ESLint to enforce code quality, security, and stylistic rules
      - name: Run Linter
        run: npm run lint

      # Step 6: Verify all files comply with Prettier formatting without modifying them
      - name: Verify Formatting
        run: npm run format:check

      # Step 7: Execute automated Vitest unit test suite
      - name: Run Unit Tests
        run: npm run test
